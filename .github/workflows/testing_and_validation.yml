name: Testing and Validation

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-and-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests and dependency validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      MAAS_TIMEZONE: UTC
      SQL_ENGINE: django.db.backends.sqlite3
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CHANNEL_HOST: localhost
      CHANNEL_PORT: "6379"
    services:
      # CI-only database, without production credentials or repository secrets.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Initialize runner paths
        run: |
          echo "TEST_SSL_CERT_DIR=$RUNNER_TEMP/dmod-ssl/local" >> "$GITHUB_ENV"
          echo "DMOD_TEST_SSL_CERT_DIR=$RUNNER_TEMP/dmod-ssl/local" >> "$GITHUB_ENV"
          echo "SQL_DATABASE=$RUNNER_TEMP/dmod-tests.sqlite3" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Matches the root pyproject.toml minimum; older CI versions no longer do.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            python/**/pyproject.toml
            .github/workflows/testing_and_validation.y*ml

      - name: Prepare compatible build tooling
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          # DMOD uses the pre-14 websockets API and imports pkg_resources.
          # Keep these compatibility constraints in CI, without editing manifests.
          cat > "$RUNNER_TEMP/dmod-ci-constraints.txt" <<'EOF'
          websockets>=10.1,<14
          setuptools>=80.9,<81
          # Existing CSV readers use date_parser; metrics expect nanosecond dates.
          pandas>=2.3,<3
          EOF
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/dmod-ci-constraints.txt" >> "$GITHUB_ENV"
          echo "PIP_BUILD_CONSTRAINT=$RUNNER_TEMP/dmod-ci-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install --upgrade 'pip>=25.3' 'setuptools>=80.9,<81' wheel

      - name: Install dependencies and all local packages
        run: |
          # One resolver transaction ensures dmod.* comes from this checkout,
          # including packages omitted by the old test-directory-based installer.
          packages=()
          for manifest in python/lib/*/pyproject.toml python/services/*/pyproject.toml; do
            packages+=("./${manifest%/pyproject.toml}[test]")
          done
          python -m pip install -r requirements.txt "${packages[@]}"

      - name: Validate installed dependencies
        id: dependencies
        run: |
          python -m pip check
          mkdir -p "$RUNNER_TEMP/dmod-test-results"
          python -m pip freeze > "$RUNNER_TEMP/dmod-test-results/dependencies.txt"

      - name: Generate test SSL certificates
        id: certificates
        run: |
          mkdir -p "$TEST_SSL_CERT_DIR"
          bash scripts/gen_cert.sh -d "$TEST_SSL_CERT_DIR" -host localhost -email dmod-ci@example.invalid
          openssl x509 -in "$TEST_SSL_CERT_DIR/certificate.pem" -noout -checkend 0

      - name: Run library and service unit tests
        # The documented helper isolates packages in separate interpreters.
        # This preserves importable multiprocessing classes and event-loop isolation.
        # Integration tests (it_*.py) remain in integration_tests.yml.
        run: |
          run_unit_tests() {
            local failed=0 package result
            for package in python/lib/* python/services/*; do
              [[ -d "$package/dmod/test" ]] || continue
              echo "Testing $package"
              if bash scripts/test_package.sh --venv "$GITHUB_WORKSPACE/.venv" -v "$package"; then
                echo "Passed: $package"
              else
                result=$?
                if [[ "$result" -eq 5 ]]; then
                  # Python 3.12 unittest uses exit 5 for a suite with zero tests.
                  echo "No unit tests defined: $package"
                else
                  echo "Failed: $package (exit $result)"
                  failed=1
                fi
              fi
            done
            return "$failed"
          }
          run_unit_tests 2>&1 | tee "$RUNNER_TEMP/dmod-test-results/unit.log"
        timeout-minutes: 15

      - name: Run evaluation service Django tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.certificates.outcome == 'success' }}
        working-directory: python/services/evaluationservice/dmod/evaluationservice
        run: python manage.py test --noinput --verbosity 2
        timeout-minutes: 10

      - name: Run GUI Django tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.certificates.outcome == 'success' }}
        working-directory: python/gui
        run: python manage.py test --noinput --verbosity 2
        timeout-minutes: 10

      - name: Upload test results and dependency versions
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testing-and-validation-python-3.12
          path: ${{ runner.temp }}/dmod-test-results/
          if-no-files-found: ignore
          retention-days: 7
